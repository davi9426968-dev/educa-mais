<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Educa+: tecnologia para apoiar a aprendizagem de alunos, professores e responsáveis." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lexend:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Educa+</title>
    <script>
      // Aplica o tema antes do primeiro paint: sem isso a página piscaria
      // branca por um instante antes do React assumir.
      (function () {
        try {
          var salvo = localStorage.getItem("educamais:tema");
          var escuro =
            salvo === "escuro" ||
            (salvo === null && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (escuro) {
            document.documentElement.classList.add("dark");
            document.documentElement.style.colorScheme = "dark";
          }
        } catch (e) {
          /* modo privado sem localStorage: segue no tema claro */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
